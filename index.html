<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ken Analysis Ticket Maker</title>
<style>
:root{--blue:#1a4398;--yellow:#ffc933;--bg:#e6ebf7;--ink:#0d2557}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);padding:16px}
.app{max-width:900px;margin:0 auto}
h2{font-size:20px;margin-bottom:10px}
.panel{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin:8px 0 4px}
input,select{width:100%;padding:10px;border:2px solid #c9d3ee;border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
.game{border:2px solid #dbe3f6;border-radius:12px;padding:10px;margin-bottom:10px;position:relative}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid label{margin-top:2px}
.full{grid-column:1/-1}
.rm{position:absolute;top:8px;right:10px;border:none;background:#ffd6d6;color:#8a1111;font-weight:800;border-radius:8px;padding:4px 10px;cursor:pointer}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button.main{flex:1;min-width:150px;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
button.alt{flex:1;min-width:150px;background:var(--yellow);color:var(--ink);border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
.hint{font-size:13px;opacity:.8;margin-top:6px}
#previewBox{width:100%;overflow:hidden;border-radius:14px;background:#fff}
#previewScale{transform-origin:top left}
/* ===== FLYER ===== */
.flyer{width:1280px;min-height:683px;background:#e6ebf7;font-family:'Segoe UI',Arial,sans-serif;color:#0a1c47;padding:22px 30px;display:flex;flex-direction:column;font-weight:800}
.flyer *{box-sizing:border-box}
.f-top{display:flex;align-items:center;background:#1a4398;border-radius:60px;height:100px;padding:0 30px;gap:24px;color:#fff;flex:none}
.f-logo{width:60px;height:60px;border-radius:50%;background:#ffc933;color:#1a4398;font-weight:900;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none}
.f-brand{font-size:38px;font-weight:900;letter-spacing:1px;line-height:1;white-space:nowrap}.f-brand span{color:#ffc933}
.f-brand small{display:block;font-size:17px;font-weight:800;letter-spacing:0;margin-top:6px}
.f-div{width:3px;height:54px;background:rgba(255,255,255,.55)}
.f-date{background:#ffc933;color:#0a1c47;border-radius:50px;padding:12px 24px;font-size:30px;font-weight:900;white-space:nowrap}
.f-tg{margin-left:auto;text-align:right;font-size:20px;font-weight:800;line-height:1.35;white-space:nowrap}
.f-tg b{display:block;font-size:25px;color:#ffc933;font-weight:900}
.f-card{margin-top:16px;background:#fff;border-radius:30px;padding:14px 16px 4px;flex:1;display:flex;flex-direction:column;border:4px solid #1a4398}.f-rows{flex:1;display:flex;flex-direction:column}
.f-hd,.f-row{display:grid;align-items:center;column-gap:8px}
.f-hd{background:#1a4398;color:#fff;border-radius:50px;height:60px;font-size:27px;flex:none;font-weight:900;text-align:center;letter-spacing:1px}
.f-hd div:nth-child(2){text-align:left;padding-left:12px}
.f-row{flex:1;min-height:92px;border-bottom:3px solid #c3cfec;text-align:center;font-size:30px;font-weight:900;padding:6px 0}
.f-row:last-child{border-bottom:none}
.f-lg{font-size:32px;font-weight:900;color:#1a4398;line-height:1.1}.f-lg small{display:block;font-size:23px;font-weight:900;color:#2b3d70;margin-top:4px}
.f-m{text-align:left;padding-left:12px;font-size:34px;font-weight:900;color:#0a1c47;line-height:1.12}
.f-p{color:#1a4398;font-size:31px;font-weight:900;line-height:1.12}
.f-o{font-size:38px;font-weight:900;color:#0a1c47}
.f-r{font-weight:900;font-size:30px;display:flex;gap:8px;justify-content:center;align-items:center;white-space:nowrap}
.f-r.won{color:#0b8a47}.f-r.lost{color:#d02a2a}.f-r.pend{color:#4a5a85;font-size:29px}
.f-bot{display:flex;gap:18px;margin-top:16px;flex:none}
.f-total{flex:0 0 500px;border-radius:50px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;height:98px}
.f-total .l{font-size:29px;font-weight:900}.f-total .r{font-size:62px;font-weight:900}
.f-join{flex:1;border-radius:50px;background:#1a4398;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px;height:98px}
.f-join .a{font-size:24px;font-weight:900;line-height:1.3}.f-join .a b{display:block;font-size:33px;color:#ffc933;font-weight:900}
.f-join .b{font-size:20px;font-weight:900;text-align:right;line-height:1.3}
/* ===== CLEAN STYLE ===== */
.cf{width:1280px;min-height:600px;background:#e6ebf7;font-family:'Segoe UI',Arial,sans-serif;color:#0a1c47;padding:36px 70px 44px;display:flex;flex-direction:column;font-weight:800}
.cf *{box-sizing:border-box}
.cf-top{display:flex;gap:18px;flex:none;padding:0 80px;justify-content:center}
.cf-date{flex:1;background:#1a4398;color:#ffc933;border-radius:50px;height:98px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;letter-spacing:1px}
.cf-total{flex:0 0 420px;border-radius:50px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;height:98px}
.cf-total .l{font-size:29px;font-weight:900}.cf-total .r{font-size:62px;font-weight:900}
.cf-card{margin-top:16px;justify-content:center;background:#fff;border-radius:30px;padding:14px 16px 4px;flex:1;display:flex;flex-direction:column;border:4px solid #1a4398}
.cf-h,.cf-row{display:grid;align-items:center;column-gap:14px;grid-template-columns:1.5fr 1.1fr .7fr}
.cf-h{padding:0 40px;background:#1a4398;color:#fff;border-radius:50px;height:60px;font-size:27px;font-weight:900;text-align:center;letter-spacing:1px;flex:none}

.cf-row{flex:1;min-height:100px;border-bottom:3px solid #c3cfec;text-align:center;font-size:30px;font-weight:900;padding:6px 40px}
.cf-row:last-child{border-bottom:none}
.cf-m{text-align:center;font-size:32px;font-weight:900;line-height:1.12;word-break:break-word}.cf-m small{display:block;font-size:23px;color:#2b3d70;margin-top:4px}
.cf-p{color:#1a4398;font-size:32px;font-weight:900;line-height:1.12}
.cf-o{font-size:38px;font-weight:900}
.cf-row .f-r,.cf-row .f-r.pend{font-size:32px}
/* ===== GREEN STYLE ===== */
.gf{width:1280px;min-height:720px;background:#eaf3ea;font-family:'Segoe UI',Arial,sans-serif;color:#0b2a0d;display:flex;flex-direction:column;font-weight:800}
.gf *{box-sizing:border-box}
.gf-top{background:#0c2a0e;height:150px;display:flex;align-items:center;padding:0 60px;gap:30px;color:#fff;flex:none}
.gf-logo{width:104px;height:104px;border-radius:50%;background:#fff;border:6px solid #fff;display:flex;align-items:center;justify-content:center;flex:none}
.gf-logo b{width:100%;height:100%;border-radius:50%;background:#2fb344;color:#fff;font-size:42px;font-weight:900;display:flex;align-items:center;justify-content:center}
.gf-brand{font-size:50px;font-weight:900;line-height:1.05;letter-spacing:1px}.gf-brand small{display:block;font-size:20px;font-weight:800;color:#8fe39a;letter-spacing:0;margin-top:6px}
.gf-tg{margin-left:auto;text-align:right;font-size:22px;font-weight:800;line-height:1.4}.gf-tg b{display:block;font-size:30px;color:#8fe39a;font-weight:900}
.gf-wrap{padding:26px 48px 34px;flex:1;display:flex;flex-direction:column}
.gf-bar{display:flex;height:88px;background:#0c2a0e;color:#fff;flex:none;align-items:stretch}
.gf-day{flex:1.3;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;letter-spacing:1px}
.gf-dt{flex:1;background:#6fcf72;color:#0c2a0e;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900}
.gf-hd{flex:1.3;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff}
.gf-tbl{border:3px solid #a9c9ab;border-top:none;background:#dfeedd;flex:1;display:flex;flex-direction:column}
.gf-h,.gf-r{display:grid;align-items:center;grid-template-columns:150px 1fr 330px 130px 190px}
.gf-h{background:#b9deb9;height:64px;font-size:26px;font-weight:900;text-align:center;color:#0c2a0e;border-bottom:3px solid #a9c9ab}
.gf-h div:nth-child(2){text-align:left;padding-left:14px}
.gf-r{flex:1;min-height:96px;border-bottom:3px solid #a9c9ab;text-align:center;padding:6px 0;font-weight:900}
.gf-r:last-child{border-bottom:none}
.gf-lg{font-size:32px;color:#14612a;line-height:1.1}.gf-lg small{display:block;font-size:22px;color:#2f5a35;margin-top:4px}
.gf-m{text-align:left;padding-left:14px;font-size:34px;line-height:1.12}
.gf-p{font-size:31px;color:#14612a;line-height:1.12}
.gf-o{font-size:38px}
.gf-s{font-size:30px;display:flex;gap:8px;justify-content:center;align-items:center;white-space:nowrap}
.gf-s.won{color:#0b8a47}.gf-s.lost{color:#d02a2a}.gf-s.pend{color:#4c6a50;font-size:28px}
.gf-bot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex:none;gap:20px}
.gf-note{font-size:21px;font-weight:800;color:#2f5a35;line-height:1.4}.gf-note b{display:block;font-size:28px;color:#14612a;font-weight:900}
.gf-total{border-radius:26px;padding:0 40px;height:100px;display:flex;align-items:center;gap:26px;flex:none}
.gf-total .l{font-size:30px;font-weight:900}.gf-total .r{font-size:60px;font-weight:900}
</style>
</head>
<body>
<div class="app">
  <h2>Ken Analysis Ticket Maker</h2>

  <div class="panel">
    <label>Date text (shows on the flyer)</label>
    <input id="date" placeholder="SATURDAY 14/11/2026">
    <label>Style</label>
    <select id="style"><option value="blue">Blue (Ken Analysis)</option><option value="green">Green (dark green table)</option><option value="clean">Clean (video: no league, no links)</option></select>
    <label>League (default for each game)</label>
    <input id="league" value="NBA">
    <label>Total odds (leave empty to calculate automatically)</label>
    <input id="totalOverride" inputmode="decimal" placeholder="auto">
  </div>

  <div class="panel">
    <h2>Games</h2>
    <div id="games"></div>
    <div class="btns">
      <button class="alt" id="add">+ Add game</button>
      <button class="main" id="make">Update flyer</button>
    </div>
    <p class="hint">Result: shows "Pending" before the games. After the games, choose Won or Lost and type the score.</p>
  </div>

  <div class="panel">
    <h2>Preview</h2>
    <div id="previewBox"><div id="previewScale"></div></div>
    <div class="btns" style="margin-top:12px">
      <button class="main" id="download">Download picture (PNG)</button>
      <button class="alt" id="clear">Clear all</button>
    </div>
  </div>
</div>

<div id="offscreen" style="position:fixed;left:-99999px;top:0"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var TELEGRAM = "t.me/kenanalysis1";
var BRAND_SUB = "Daily basketball analysis";
var KEY = "ken_ticket_maker_v1";

function pad(n){return n<10?"0"+n:""+n;}
function defaultDate(){
  var d=new Date(), days=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
  return days[d.getDay()]+" "+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

var gamesEl=document.getElementById('games');

function gameHTML(g,i){
  return '<div class="game" data-i="'+i+'"><button class="rm" type="button">Remove</button>'+
  '<div class="grid">'+
  '<div><label>Time</label><input class="g-time" placeholder="1:00 AM" value="'+esc(g.time||"")+'"></div>'+
  '<div><label>League</label><input class="g-lg" placeholder="NBA" value="'+esc(g.lg||"")+'"></div>'+
  '<div class="full"><label>Match</label><input class="g-match" placeholder="Magic vs Bucks" value="'+esc(g.match||"")+'"></div>'+
  '<div><label>Pick</label><input class="g-pick" placeholder="Magic to win" value="'+esc(g.pick||"")+'"></div>'+
  '<div><label>Odd</label><input class="g-odd" inputmode="decimal" placeholder="1.26" value="'+esc(g.odd||"")+'"></div>'+
  '<div><label>Result</label><select class="g-res"><option value="">Pending</option><option value="won"'+(g.res==="won"?" selected":"")+'>Won</option><option value="lost"'+(g.res==="lost"?" selected":"")+'>Lost</option></select></div>'+
  '<div><label>Score (optional)</label><input class="g-score" placeholder="107 - 99" value="'+esc(g.score||"")+'"></div>'+
  '</div></div>';
}

function readGames(){
  var out=[];
  gamesEl.querySelectorAll('.game').forEach(function(el){
    out.push({time:el.querySelector('.g-time').value.trim(),lg:el.querySelector('.g-lg').value.trim(),match:el.querySelector('.g-match').value.trim(),
      pick:el.querySelector('.g-pick').value.trim(),odd:el.querySelector('.g-odd').value.trim(),res:el.querySelector('.g-res').value,score:el.querySelector('.g-score').value.trim()});
  });
  return out;
}
function renderForm(list){
  gamesEl.innerHTML=list.map(gameHTML).join("");
  gamesEl.querySelectorAll('.rm').forEach(function(b){b.onclick=function(){var l=readGames();l.splice(+b.parentNode.dataset.i,1);renderForm(l);update();};});
  gamesEl.querySelectorAll('input,select').forEach(function(x){x.addEventListener('input',update);x.addEventListener('change',update);});
}

function flyerGreen(state){
  var games=state.games.filter(function(g){return g.match&&g.pick&&g.odd;});
  var allWon=games.length>0&&games.every(function(g){return g.res==="won";});
  var anyLost=games.some(function(g){return g.res==="lost";});
  var prod=1; games.forEach(function(g){var o=parseFloat(String(g.odd).replace(",","."));if(o>0)prod*=o;});
  var total=state.totalOverride?state.totalOverride:(games.length?prod.toFixed(2):"-");
  var d=(state.date||defaultDate()).split(" "), day=d[0], dt=d.slice(1).join(" ");
  var rows=games.map(function(g){
    var lg=esc(g.lg||state.league||"");
    var res;
    if(g.res==="won")res='<div class="gf-s won"><span>'+esc(g.score)+'</span><span>&#10004;</span></div>';
    else if(g.res==="lost")res='<div class="gf-s lost"><span>'+esc(g.score)+'</span><span>&#10008;</span></div>';
    else res='<div class="gf-s pend">Pending</div>';
    return '<div class="gf-r"><div class="gf-lg">'+lg+'<small>'+esc(g.time)+'</small></div><div class="gf-m">'+esc(g.match)+'</div><div class="gf-p">'+esc(g.pick)+'</div><div class="gf-o">'+esc(g.odd)+'</div>'+res+'</div>';
  }).join("");
  var label="COMBINED RATE", bg="#0c2a0e", fg="#ffffff";
  if(allWon){label="COMBINED RATE WON";bg="#2fb344";fg="#062a0c";}
  else if(anyLost){label="TICKET LOST";bg="#ff8a8a";fg="#3a0808";}
  return '<div class="gf">'+
  '<div class="gf-top"><div class="gf-logo"><b>KA</b></div><div class="gf-brand">KEN<br>ANALYSIS FC<small>'+esc(BRAND_SUB)+'</small></div><div class="gf-tg">Join us on Telegram<b>'+esc(TELEGRAM)+'</b></div></div>'+
  '<div class="gf-wrap"><div class="gf-bar"><div class="gf-day">'+esc(day)+'</div><div class="gf-dt">'+esc(dt)+'</div><div class="gf-hd">@kenanalysis1</div></div>'+
  '<div class="gf-tbl"><div class="gf-h"><div>LEAGUE</div><div>MATCH</div><div>SELECTION</div><div>RATE</div><div>RESULT</div></div>'+rows+'</div>'+
  '<div class="gf-bot"><div class="gf-note">Free daily analysis<b>'+esc(TELEGRAM)+'</b>18+ | Bet responsibly. No result is guaranteed.</div>'+
  '<div class="gf-total" style="background:'+bg+';color:'+fg+'"><div class="l">'+label+'</div><div class="r">'+esc(total)+'</div></div></div></div>'+
  '</div>';
}

function flyerClean(state){
  var games=state.games.filter(function(g){return g.match&&g.pick&&g.odd;});
  var allWon=games.length>0&&games.every(function(g){return g.res==="won";});
  var anyLost=games.some(function(g){return g.res==="lost";});
  var prod=1; games.forEach(function(g){var o=parseFloat(String(g.odd).replace(",","."));if(o>0)prod*=o;});
  var total=state.totalOverride?state.totalOverride:(games.length?prod.toFixed(2):"-");
  var rh=games.length>7?72:games.length>5?84:100;
  var rows=games.map(function(g){
    var res;
    if(g.res==="won")res='<div class="f-r won"><span>'+esc(g.score)+'</span><span>&#10004;</span></div>';
    else if(g.res==="lost")res='<div class="f-r lost"><span>'+esc(g.score)+'</span><span>&#10008;</span></div>';
    else res='<div class="f-r pend">Pending</div>';
    var mf=32, pf=32;
    return '<div class="cf-row" style="min-height:'+rh+'px"><div class="cf-m" style="font-size:'+mf+'px">'+esc(g.match)+'</div><div class="cf-p" style="font-size:'+pf+'px">'+esc(g.pick)+'</div>'+res+'</div>';
  }).join("");
  var label="TOTAL ODDS", bg="#ffc933", fg="#0d2557";
  if(allWon){label="TOTAL ODDS WON";bg="#3ddc84";fg="#06301a";}
  else if(anyLost){label="TICKET LOST";bg="#ff8a8a";fg="#3a0808";}
  return '<div class="cf"><div class="cf-top"><div class="cf-date">'+esc(state.date||defaultDate())+'</div>'+
  '<div class="cf-total" style="background:'+bg+';color:'+fg+'"><div class="l">'+label+'</div><div class="r">'+esc(total)+'</div></div></div>'+
  '<div class="cf-card"><div class="cf-h"><div>MATCH</div><div>PICK</div><div>RESULT</div></div>'+rows+'</div></div>';
}

function flyerHTML(state){
  if(state.style==="clean")return flyerClean(state);
  if(state.style==="green")return flyerGreen(state);
  var games=state.games.filter(function(g){return g.match&&g.pick&&g.odd;});
  var anyRes=true;
  var allWon=games.length>0&&games.every(function(g){return g.res==="won";});
  var anyLost=games.some(function(g){return g.res==="lost";});
  var prod=1; games.forEach(function(g){var o=parseFloat(String(g.odd).replace(",","."));if(o>0)prod*=o;});
  var total=state.totalOverride?state.totalOverride:(games.length?prod.toFixed(2):"-");
  var cols=anyRes?"150px 1fr 290px 120px 190px":"150px 1fr 320px 130px";
  var rows=games.map(function(g){
    var lg=esc(g.lg||state.league||"");
    var res="";
    if(anyRes){
      if(g.res==="won")res='<div class="f-r won"><span>'+esc(g.score)+'</span><span>&#10004;</span></div>';
      else if(g.res==="lost")res='<div class="f-r lost"><span>'+esc(g.score)+'</span><span>&#10008;</span></div>';
      else res='<div class="f-r pend">Pending</div>';
    }
    return '<div class="f-row" style="grid-template-columns:'+cols+'"><div class="f-lg">'+lg+'<small>'+esc(g.time)+'</small></div><div class="f-m">'+esc(g.match)+'</div><div class="f-p">'+esc(g.pick)+'</div><div class="f-o">'+esc(g.odd)+'</div>'+res+'</div>';
  }).join("");
  var label="TOTAL ODDS", bg="#ffc933", fg="#0d2557";
  if(allWon){label="TOTAL ODDS WON";bg="#3ddc84";fg="#06301a";}
  else if(anyLost){label="TICKET LOST";bg="#ff8a8a";fg="#3a0808";}
  return '<div class="flyer">'+
  '<div class="f-top"><div class="f-logo">KA</div><div class="f-brand">KEN <span>ANALYSIS</span> FC<small>'+esc(BRAND_SUB)+'</small></div><div class="f-div"></div><div class="f-date">'+esc(state.date||defaultDate())+'</div><div class="f-tg">Join us on Telegram<b>'+esc(TELEGRAM)+'</b></div></div>'+
  '<div class="f-card"><div class="f-hd" style="grid-template-columns:'+cols+'"><div>LEAGUE</div><div>MATCH</div><div>PICK</div><div>ODD</div>'+(anyRes?'<div>RESULT</div>':'')+'</div><div class="f-rows">'+rows+'</div></div>'+
  '<div class="f-bot"><div class="f-total" style="background:'+bg+';color:'+fg+'"><div class="l">'+label+'</div><div class="r">'+esc(total)+'</div></div>'+
  '<div class="f-join"><div class="a">Free daily analysis<b>'+esc(TELEGRAM)+'</b></div><div class="b">18+ | Bet responsibly<br>No result is guaranteed</div></div></div>'+
  '</div>';
}

function getState(){
  return {style:document.getElementById('style').value,date:document.getElementById('date').value.trim(),league:document.getElementById('league').value.trim(),
    totalOverride:document.getElementById('totalOverride').value.trim(),games:readGames()};
}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}

function fitPreview(){
  var box=document.getElementById('previewBox'), sc=document.getElementById('previewScale');
  var s=Math.min(1,box.clientWidth/1280);
  sc.style.transform="scale("+s+")";
  var f=sc.firstElementChild; if(f){box.style.height=(f.offsetHeight*s)+"px";}
}
function update(){
  var st=getState(); save(st);
  document.getElementById('previewScale').innerHTML=flyerHTML(st);
  fitPreview();
}
window.addEventListener('resize',fitPreview);

document.getElementById('add').onclick=function(){var l=readGames();l.push({lg:document.getElementById('league').value.trim()});renderForm(l);update();};
document.getElementById('make').onclick=update;
document.getElementById('clear').onclick=function(){if(confirm("Clear all games?")){renderForm([{},{}]);document.getElementById('totalOverride').value="";update();}};
document.getElementById('date').addEventListener('input',update);
document.getElementById('style').addEventListener('change',update);
document.getElementById('league').addEventListener('input',update);
document.getElementById('totalOverride').addEventListener('input',update);

document.getElementById('download').onclick=function(){
  var st=getState(), off=document.getElementById('offscreen');
  off.innerHTML=flyerHTML(st);
  var el=off.firstElementChild;
  if(typeof html2canvas==="undefined"){alert("Could not load the picture tool. Check your internet and try again.");return;}
  html2canvas(el,{scale:2,backgroundColor:"#e6ebf7",useCORS:true}).then(function(c){
    var a=document.createElement('a');
    a.download="ken-analysis-ticket.png";
    a.href=c.toDataURL("image/png");
    document.body.appendChild(a);a.click();a.remove();
    off.innerHTML="";
  });
};

(function init(){
  var s=load();
  document.getElementById('date').value=(s&&s.date)||defaultDate();
  document.getElementById('style').value=(s&&s.style)||"blue";
  if(s){document.getElementById('league').value=s.league||"NBA";document.getElementById('totalOverride').value=s.totalOverride||"";}
  renderForm((s&&s.games&&s.games.length)?s.games:[{},{}]);
  update();
})();
</script>
</body>
</html>
